org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Superb Warfare is an optional runtime dependency reached by reflection (SbwImpl): no jar and no extra compile-time
# dependency is needed to build, and there are no build switches for it.
#
# ForgeGradle 7 (Forge 1.21+ nodes): puts the classes and resources of a source set in one directory for the dev run.
net.minecraftforge.gradle.merge-source-sets=true

# Per-node values (Minecraft version, loader versions, Java version) live in versions/<node>/gradle.properties.

mod_id=superbcamera
mod_name=Simple Perspective Camera
mod_license=GPL-3.0-only
mod_version=0.3.0
mod_authors=Teamuhi
mod_description=Client-side cinematic camera: adjustable, lockable third-person perspectives added to the F5 cycle, with a live editor and vehicle/target following.
superbwarfare_version_range=[0.8,)
