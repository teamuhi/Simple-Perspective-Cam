modLoader = "kotlinforforge"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "superbcamera.mixins.json"

[[mixins]]
config = "superbcamera.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# Optional: with Superb Warfare installed, a perspective anchored to one of its vehicles also follows the vehicle's
# pitch and roll. Without it the mod works with the player, the player and other entities (the Vehicle anchor is hidden).
[[dependencies.${mod_id}]]
modId = "superbwarfare"
type = "optional"
versionRange = "${superbwarfare_version_range}"
ordering = "AFTER"
side = "CLIENT"
